  # ETFs - require market data + news
  # 板块 ETF 按研究归属组定价，GLD 独立研究。其他研究可以引用这些 ETF 作为背景。
  # SPY / QQQ / DIA 都是可投资的现货 ETF；美国 GENERAL 的三个镜头分别负责其操作卡。
  # 三者的取数入口在 benchmarks 和 symbol_contracts，派单单位为 GENERAL。
  etfs:
    - SMH      # VanEck Semiconductor ETF (半导体)
    - XLF      # Financial Select Sector SPDR (金融)
    - XLV      # Health Care Select Sector SPDR (医疗)
    - XLE      # Energy Select Sector SPDR (能源)
    - XLU      # Utilities Select Sector SPDR (公用事业)
    - XLP      # Consumer Staples Select Sector SPDR (必选消费)
    - IGV      # iShares Expanded Tech-Software ETF (软件)
    - ITA      # iShares U.S. Aerospace & Defense ETF (国防航天)
    - REMX     # VanEck Rare Earth/Strategic Metals ETF (稀土战略矿产)
    - GLD      # SPDR Gold Shares (黄金; 2026-11-06 起进"商品"组, 排在板块组之后; 以后石油 / 白银等商品型 ETF 同组)
    # (DAX 曾于 2026-09-29 入列借 ETF 框架, 但此列表兼作美股分组依据, DAX 被前端挂进美股宽基堆
    #  → 2026-09-30 撤出; 框架归类改走 symbol_contracts.DAX.context_type: etf, 列表回归纯美股语义)

  # Benchmarks - 用于 GENERAL 宏观分析的三镜头基准
  # (盘前盘后有真实成交量，替代了原 SPX/NDX/INDU 指数)
  benchmarks:
    - SPY      # S&P 500 ETF，兼作基准与可交易镜头
    - QQQ      # Nasdaq-100 ETF，兼作基准与可交易镜头
    - DIA      # Dow Jones ETF，兼作基准与可交易镜头

  # GENERAL 系列 - 宏观大盘分析虚拟标的, 不进 IBKR fetch (sec_type=IND 占位)
  # 报告落在 data/debate/{SYMBOL}/, 前端 sidebar 按 region 分大区显示
  generals:
    - GENERAL          # 美国宏观 (默认; 历史无后缀)
    - GENERAL_EU       # 欧洲宏观 (Eurozone + UK)
    - GENERAL_JP       # 日本宏观
    - GENERAL_KR       # 韩国宏观 (KOSPI 大盘; 与日本独立: BoK/KRW/新兴市场分类)

# 自动运行开关:
#   每个 symbol_contracts 条目可选字段 `runnable: true/false`, 缺省 = true
#   horizon_sentinel + data_scheduler 只跑 runnable != false 的标的
#   runnable: false → 自动调度跳过, 但前端依然展示, 由 Claude Code 引导手动分析后
#                     写入 data/debate/{SYMBOL}/, /api/symbol-groups 输出 manual_only=true
#
# 分析大区:
#   每个 symbol_contracts 条目可选字段 `region: US|EU|JP`, 缺省 = US
#   决定 GENERAL 宏观分析和情绪/经济基本面取哪份数据 (隔壁 Claude Code 工程读用)
#   命名约定: 数据文件 US 不带后缀, EU 带 _eu, JP 带 _jp
#     如 data/fear_greed/fear_greed_latest_*.json (US)
#        data/fear_greed/fear_greed_eu_latest_*.json (EU, 含 eurozone + uk 子块)
#        data/economic/economic_indicators_jp_*.json (JP)
#   前端主页改版后按 region 一级分组 → 板块二级 → 个股三级

  # Indices - 已废弃，改用 ETF (SPY/QQQ/DIA)
  # indices:
  #   - SPX      # S&P 500 Index
  #   - NDX      # Nasdaq-100 Index
  #   - INDU     # Dow Jones Industrial Average


