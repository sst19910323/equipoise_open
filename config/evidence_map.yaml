# ── 2026-08-12 新增: SpaceX (2026-06-12 上市, 只有约 2 个月日线) ──
SPCX:  {peers: [PLTR, NVDA, TSLA], banned_benchmarks: [], econ: [US.fed_funds_rate],
        notes: "真同业(卫星: ASTS/RKLB/IRDM/Viasat; AI 云: CRWV/ORCL)全未入库 → 走 Scout 搜索腿。
                库内三个对标都只是侧面: PLTR=AI+防务叙事+同 sector(ITA)、NVDA=AI capex 链条
                (Q2 capex 18.4B 中 15.8B 砸 AI 段)、TSLA=马斯克复合体/散户情绪 beta(非业务同业)。
                板块标签 ITA 只解释约 1/8 收入(Space 962M/总 7814M), 且 SPCX 不是 ITA 成分, 故
                ITA/QQQ 都不禁用, 但 relative_strength 结果别当同业分化读。
                ⚠️ 上市 2 个月: peer_compare 20 日窗口能算, 60 日以上/MA50/MA200/周线全缺 → 缺失
                不等于走坏; 供给面(锁定期解禁: 8/6 已放 911.5M 股, 8-10 月每 2-4 周 7% 分批,
                Q3 财报再放约 28%, 剩余 12/8 到期, 马斯克 6.4B 股锁到 2027-06-12)是当前主驱动,
                走搜索腿核实。"}

