# econ: 相关经济指标 key, 格式 <REGION>.<indicator>, 对应 data/economic 转运文件内容。
# notes: 给证据官/仲裁者看的一句话提示。
# 没登记的标的 = 无地图, evidence_quant 会如实返回"无证据地图条目", 不瞎配。

