# peers: 本仓 canonical 代号(symbols.yaml 里存在的优先, prepare 会拉齐它们的日线)。
#        不在库的纯外部对标(未上市/无订阅)不进 peers, 走 Scout 搜索腿定性对比。
# banned_benchmarks: 该标的自己是其重仓股的 ETF → relative_strength 禁止当基准
