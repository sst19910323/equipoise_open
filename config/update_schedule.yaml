# 低频数据更新时间表 —— apex_codex 维护, hermes 只读, 由 hermes 触发。
#
# ── 给 hermes(触发方)的契约 ───────────────────────────────────────────────
# 每个 indicator 一个 `next` 块, 里面【最多两个触发槽, 每种至多一个】:
#
#   time:      { at: <UTC 时刻>, reason: <一句话> }
#       → 到 at 这个【UTC】时刻就喊 codex 刷新该 indicator。目前【唯一在用】。
#
#   condition: { watch: <名>, op: ">"|"<", value: <数>, reason: <一句话> }
#       → 某个值越过阈值才喊。【以后才加, 现在没有, hermes 暂不用管】。
#
# 任一槽条件先满足 → 喊 codex。两个槽最多各一个, 不是列表。
# codex 每次只写【下一次】的 next(下下次等下次刷新时才写)。所有时间一律 UTC。
#
# 喊法(按所在段选命令):
#   economic.<REGION>.<indicator>  → claude -p "/refresh-lowfreq <REGION> <indicator>" ...
#   fundamentals.<SYMBOL>          → claude -p "/refresh-fundamentals <SYMBOL>" ...
# codex 刷完回写 last(本次发布日)+ next。`last` 是 codex 记账, hermes 忽略。
# fundamentals = 公司财报(季度驱动); codex 刷新时顺手 upsert company 身份行。
# ──────────────────────────────────────────────────────────────────────────

